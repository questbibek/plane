name: Build & Deploy (Vrit)

# Vrit Tech fork CI/CD — NOT an upstream makeplane workflow.
# On push to `vrit`: build the 6 app images, push to GHCR, then SSH into the
# VPS and pull + migrate + restart. See deploy/README.md.

on:
  push:
    branches: [vrit]
  workflow_dispatch:

env:
  REGISTRY: ${{ vars.REGISTRY || 'ghcr.io' }}
  # GHCR namespace; defaults to the repo owner (e.g. questbibek). Lowercase.
  IMAGE_PREFIX: ${{ vars.IMAGE_PREFIX || github.repository_owner }}

jobs:
  build:
    name: Build & push images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: web,     context: ".",          file: ./apps/web/Dockerfile.web }
          - { name: admin,   context: ".",          file: ./apps/admin/Dockerfile.admin }
          - { name: space,   context: ".",          file: ./apps/space/Dockerfile.space }
          - { name: backend, context: "./apps/api", file: Dockerfile.api }
          - { name: live,    context: ".",          file: ./apps/live/Dockerfile.live }
          - { name: proxy,   context: "./apps/proxy", file: Dockerfile.ce }
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/plane-${{ matrix.name }}:vrit
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/plane-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    name: Deploy to VPS
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            cd "${{ vars.DEPLOY_PATH || '/opt/plane' }}"

            # Authenticate to GHCR for this pull (job-scoped token).
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

            # Pin this deploy to the immutable commit tag.
            export REGISTRY="${{ env.REGISTRY }}"
            export IMAGE_PREFIX="${{ env.IMAGE_PREFIX }}"
            export APP_RELEASE="${{ github.sha }}"

            docker compose -f docker-compose.vrit.yml pull
            # Run DB migrations to completion before swapping the app.
            docker compose -f docker-compose.vrit.yml run --rm migrator
            docker compose -f docker-compose.vrit.yml up -d --remove-orphans
            docker image prune -f
