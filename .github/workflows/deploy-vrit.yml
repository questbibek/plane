name: Build & Deploy (Vrit)

# Vrit Tech fork CI/CD — NOT an upstream makeplane workflow.
# On push to `vrit`: build the 6 app images, push to GHCR, then SSH into the
# VPS and pull + migrate + restart. See deploy/README.md.

on:
  push:
    branches: [vrit]
  workflow_dispatch:

env:
  REGISTRY: ${{ vars.REGISTRY || 'ghcr.io' }}
  # GHCR namespace; defaults to the repo owner (e.g. questbibek). Lowercase.
  IMAGE_PREFIX: ${{ vars.IMAGE_PREFIX || github.repository_owner }}

jobs:
  build:
    name: Build & push images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: web,     context: ".",          file: ./apps/web/Dockerfile.web }
          - { name: admin,   context: ".",          file: ./apps/admin/Dockerfile.admin }
          - { name: space,   context: ".",          file: ./apps/space/Dockerfile.space }
          - { name: backend, context: "./apps/api", file: ./apps/api/Dockerfile.api }
          - { name: live,    context: ".",          file: ./apps/live/Dockerfile.live }
          - { name: proxy,   context: "./apps/proxy", file: ./apps/proxy/Dockerfile.ce }
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/plane-${{ matrix.name }}:vrit
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/plane-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    name: Deploy to VPS
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      # Native SSH only — no third-party action.
      - name: Deploy over SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/plane' }}
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_PREFIX: ${{ env.IMAGE_PREFIX }}
          APP_RELEASE: ${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          SSHO="-i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -p $SSH_PORT"

          # Keep the VPS compose in sync with the repo on every deploy.
          ssh $SSHO "$SSH_USER@$SSH_HOST" "mkdir -p $DEPLOY_PATH"
          scp -i ~/.ssh/deploy_key -P "$SSH_PORT" -o StrictHostKeyChecking=accept-new \
            deploy/docker-compose.vrit.yml "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/docker-compose.vrit.yml"

          # Run remotely: GHCR login, pull pinned images, migrate, restart.
          ssh $SSHO "$SSH_USER@$SSH_HOST" \
            "cd $DEPLOY_PATH \
             && echo '$GHCR_TOKEN' | docker login $REGISTRY -u '$GHCR_USER' --password-stdin \
             && export REGISTRY='$REGISTRY' IMAGE_PREFIX='$IMAGE_PREFIX' APP_RELEASE='$APP_RELEASE' \
             && docker compose -f docker-compose.vrit.yml pull \
             && docker compose -f docker-compose.vrit.yml run --rm migrator \
             && docker compose -f docker-compose.vrit.yml up -d --remove-orphans \
             && docker image prune -f"
